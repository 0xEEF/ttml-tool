[package]
name = "amll-ttml-tool"
version = "0.20.1"
description = "A word-by-word TTML lyrics editor and timing tool for Spicy Lyrics"
license = "AGPL-3.0"
repository = "https://github.com/spicylyrics/ttml-tool"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "amll_ttml_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

# The webview runtime. Default is the stock wry runtime (WebKitGTK on Linux).
# `--features qt --no-default-features` switches Linux to the experimental
# Qt/QtWebEngine runtime (TauriQt) for a Chromium-class rendering path.
[features]
default = ["wry"]
wry = ["tauri/wry", "tauri/x11", "tauri/common-controls-v6"]
# custom-protocol: release builds must serve the embedded assets via tauri://
# instead of falling back to devUrl (tauri-build sets dev = !custom-protocol).
qt = ["dep:tauri-runtime-qt", "tauri/custom-protocol"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
discord-rich-presence = "1.1.0"
tauri = { version = "2.9.5", default-features = false, features = [
	"devtools",
	"protocol-asset",
	"compression",
	"dynamic-acl",
] }
tao = "0.34"
tauri-plugin-log = "2.8.0"
window-vibrancy = "0.7"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
# Drives webkit2gtk directly for native decorations; stays a hard dependency so
# its `decorum:*` capability permissions always validate. The plugin is only
# initialized on the wry runtime (see lib.rs).
tauri-plugin-decorum = "1"
tauri-plugin-process = "2.3.1"
# Portal backend so Linux shows the desktop's own file picker (zenity fallback).
tauri-plugin-dialog = { version = "~2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "~2.4.5"
tauri-plugin-persisted-scope = "2"
# Renders the recolored logo for the window and shortcut icons. No text support needed.
resvg = { version = "0.49", default-features = false }

# Experimental Qt/QtWebEngine runtime (TauriQt), enabled by the `qt` feature.
# Vendored (not the git dep) and adapted to tauri-runtime 2.9.2: the upstream
# runtime targets tauri-runtime 2.12, whose RuntimeHandle monitor methods return
# plain Option/Vec and whose WindowBuilder/WebviewDispatch gained
# no_redirection_bitmap / eval_script_with_callback. The vendored copy reverts
# those to the 2.9.2 signatures.
[target.'cfg(target_os = "linux")'.dependencies]
# devtools keeps the open/close/is_devtools_open impls (they'd be cfg'd out in
# release otherwise); default-features off drops tauri-runtime-2-12.
tauri-runtime-qt = { path = "vendor/tauri-runtime-qt", features = ["devtools"], default-features = false, optional = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.9.0"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
