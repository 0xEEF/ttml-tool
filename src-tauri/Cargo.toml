[package]
name = "amll-ttml-tool"
version = "0.20.0"
description = "A word-by-word TTML lyrics editor and timing tool for Spicy Lyrics"
license = "AGPL-3.0"
repository = "https://github.com/spicylyrics/ttml-tool"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "amll_ttml_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

# The webview runtime. Default is the stock wry runtime (WebKitGTK on Linux).
# `--features qt --no-default-features` switches Linux to the experimental
# Qt/QtWebEngine runtime (TauriQt) for a Chromium-class rendering path.
[features]
default = ["wry"]
wry = ["tauri/wry", "tauri/x11", "tauri/common-controls-v6"]
qt = ["dep:tauri-runtime-qt"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
discord-rich-presence = "1.1.0"
tauri = { version = "2.9.5", default-features = false, features = [
	"devtools",
	"protocol-asset",
	"compression",
	"dynamic-acl",
] }
tao = "0.34"
tauri-plugin-log = "2.8.0"
window-vibrancy = "0.7"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-decorum = "1"
tauri-plugin-process = "2.3.1"
# Portal backend so Linux shows the desktop's own file picker (zenity fallback).
tauri-plugin-dialog = { version = "~2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "~2.4.5"
tauri-plugin-persisted-scope = "2"
# Renders the recolored logo for the window and shortcut icons. No text support needed.
resvg = { version = "0.49", default-features = false }

# Experimental Qt/QtWebEngine runtime (TauriQt), enabled by the `qt` feature.
# Pinned to a rev and built with default-features off: the runtime's default
# `tauri-runtime-2-12` feature only adds `set_fullscreen_on_monitor`, which does
# not exist in the `tauri-runtime` 2.9.2 that tauri 2.9.5 uses.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-qt = { git = "https://github.com/Alper-Celik/TauriQt", rev = "d2b4c877931790b52f81b917e4f0057c504489bd", default-features = false, optional = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.9.0"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
